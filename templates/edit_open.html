{% extends "base.html" %}
{% block title %}Edit Bet — Spooky Sports{% endblock %}

{% block content %}
<div class="card" style="max-width:500px; margin:0 auto;">
    <h2>Edit Bet</h2>
    <form method="post">
        <div class="form-row">
            <label>American Odds</label>
            <input name="odds" type="text" inputmode="numeric" pattern="[+-]?[0-9]+" placeholder="e.g. -215" value="{{ (b.odds | american_odds) if b.odds else '' }}" required>
        </div>
        <div style="display:flex; gap:8px; margin-top:8px;">
            <button type="submit" style="flex:1;">Save Changes</button>
            <a href="{{ url_for('index') }}" style="flex:1; display:block;">
                <button type="button" class="secondary" style="width:100%;">Cancel</button>
            </a>
        </div>
    </form>
</div>
{% endblock %}
