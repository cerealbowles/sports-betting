{# Shared JS for _open_bets_section.html — close-bet modal, cashout, and live
   score polling. Included inside each page's own {% block scripts %} rather
   than duplicated, for the same reason the markup partial is shared.
   Expects `closing_suggestions` in context ({bet_id: american_odds}). #}
<script>
// Convert bet card game times to local timezone
document.querySelectorAll('.bc-time[data-utc]').forEach(function(el) {
    try {
        var d = new Date(el.getAttribute('data-utc'));
        if (isNaN(d)) return;
        var m = d.getMonth() + 1;
        var day = d.getDate();
        var t = d.toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'}).toLowerCase();
        el.textContent = m + '/' + day + ' ' + t;
    } catch(e) {}
});

var _closingSuggestions = {{ (closing_suggestions or {}) | tojson }};
// ── In-sheet bet management (edit / close / delete) ─────────────────────────
// The modals are rendered inside .container, whose stacking context sits below
// the body-level bottom sheets no matter the z-index — hoist them to <body> so
// they can open above an open sheet.
function bdmHoist(id) {
    var m = document.getElementById(id);
    if (m && m.parentElement !== document.body) document.body.appendChild(m);
    return m;
}

function bdmDetails(el) { return el.closest('.bc-details'); }

function bdmShow(el, view) {
    var d = bdmDetails(el);
    if (!d) return;
    d.querySelectorAll('.bdm-view').forEach(function (v) { v.hidden = v.getAttribute('data-view') !== view; });
    if (view === 'close') bdmInitClose(d);
}

// ── Card flip ───────────────────────────────────────────────────────────────
// Tapping a card turns it edge-on, swaps everything under the matchup/time
// header between the live summary and the manage panel, then turns it back.
function bcFlip(el) {
    var card = el.closest('.bet-card');
    if (!card || card.classList.contains('bc-flipping')) return;
    card.classList.add('bc-flipping');
    setTimeout(function () {
        var toBack = !card.classList.contains('is-flipped');
        card.classList.toggle('is-flipped', toBack);
        var d = card.querySelector('.bc-details');
        d.hidden = !toBack;
        card.querySelector('.bc-front-body').hidden = toBack;
        if (toBack) bdmShow(d.querySelector('.bdm-view'), 'main');
        card.classList.remove('bc-flipping');
    }, 170);
}

document.addEventListener('click', function (e) {
    var t = e.target.closest('.bc-flip');
    if (t) bcFlip(t);
});
document.addEventListener('keydown', function (e) {
    if ((e.key !== 'Enter' && e.key !== ' ') || !e.target.classList || !e.target.classList.contains('bc-flip')) return;
    e.preventDefault();
    e.target.click();
});

function bdmInitClose(d) {
    var id  = d.getAttribute('data-id');
    var cl  = d.querySelector('.bdm-closing-line');
    var note = d.querySelector('.bdm-cl-note');
    var suggested = _closingSuggestions[id];
    if (suggested !== undefined) {
        cl.value = (suggested > 0 ? '+' : '') + suggested;
        note.textContent = 'Auto-filled from FanDuel at game start — edit if needed.';
    } else {
        cl.value = '';
        note.textContent = 'Will be auto-filled from FanDuel history when game starts.';
    }
    var entry = d.getAttribute('data-entry-amer'), curr = d.getAttribute('data-curr-amer');
    var row = d.querySelector('.bdm-co-line-row');
    if (entry && curr) {
        var fmt = function (v) { return (parseFloat(v) > 0 ? '+' : '') + v; };
        d.querySelector('.bdm-co-line').textContent = fmt(entry) + ' → ' + fmt(curr);
        row.hidden = false;
    } else {
        row.hidden = true;
    }
    var amt = d.querySelector('.bdm-co-amount');
    var pnl = d.querySelector('.bdm-co-pnl');
    var stake = parseFloat(d.getAttribute('data-stake')) || 0;
    amt.value = '';
    pnl.textContent = '';
    amt.oninput = function () {
        var diff = (parseFloat(this.value) || 0) - stake;
        pnl.textContent = (diff >= 0 ? '+' : '') + '$' + diff.toFixed(2) + ' vs stake';
        pnl.style.color = diff >= 0 ? 'var(--win)' : 'var(--loss)';
    };
    bdmOutcome(d.querySelector('.bdm-seg button'), 'win');
}

function bdmOutcome(btn, outcome) {
    var d = bdmDetails(btn);
    d.querySelectorAll('.bdm-seg button').forEach(function (b) {
        var o = b.getAttribute('data-outcome');
        b.className = o === outcome ? 'on-' + o : '';
    });
    var wl = d.querySelector('.bdm-winloss'), co = d.querySelector('.bdm-cashout');
    if (outcome === 'cashout') {
        wl.hidden = true; co.hidden = false;
        setTimeout(function () { d.querySelector('.bdm-co-amount').focus(); }, 50);
    } else {
        wl.hidden = false; co.hidden = true;
        wl.querySelector('input[name="outcome"]').value = outcome;
        wl.querySelector('.bdm-submit').textContent = outcome === 'win' ? 'Confirm Win' : 'Confirm Loss';
    }
}

function bdmConfirmCashout(btn) {
    var d = bdmDetails(btn);
    var amount = parseFloat(d.querySelector('.bdm-co-amount').value);
    if (!amount || amount <= 0) { alert('Enter the cashout amount from your sportsbook.'); return; }
    btn.disabled = true;
    btn.textContent = 'Processing…';
    fetch('/api/cashout/' + d.getAttribute('data-id'), {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({cashout_amount: amount}),
    })
    .then(function (r) { return r.json(); })
    .then(function (res) {
        if (res.ok) { window.location.reload(); }
        else { alert('Error: ' + (res.error || 'Unknown')); btn.disabled = false; btn.textContent = 'Confirm Cashout'; }
    })
    .catch(function () { alert('Network error.'); btn.disabled = false; btn.textContent = 'Confirm Cashout'; });
}

function openDeleteBetModal(btn) {
    var d = bdmDetails(btn);
    document.getElementById('delete_bet_name').textContent = d.getAttribute('data-name');
    document.getElementById('delete_bet_note').textContent = '$' + d.getAttribute('data-stake') + ' will be returned to your bankroll.';
    document.getElementById('deleteBetForm').action = '/delete_open/' + d.getAttribute('data-id');
    bdmHoist('deleteBetModal').style.display = 'flex';
}

function closeDeleteBetModal() {
    document.getElementById('deleteBetModal').style.display = 'none';
}



// ── Live score polling ────────────────────────────────────────────────────────
(function () {
  // Renders a 3-base diamond SVG + out dots for MLB live games.
  // b = {first, second, third, outs}
  function renderDiamond(b) {
    var on  = '#FB4F14', off = 'rgba(148,163,184,0.18)';
    var so  = '#FB4F14', sof = 'rgba(148,163,184,0.35)';
    // Each 8×8 rect rotated 45° has half-diagonal ≈ 5.7px — keep centers ≥ 7px from each edge.
    // viewBox 0 0 40 30: 2nd=(20,7), 1st=(34,20), 3rd=(6,20)
    function sq(cx, cy, occ) {
      return '<rect x="' + (cx - 4) + '" y="' + (cy - 4) + '" width="8" height="8"'
        + ' transform="rotate(45 ' + cx + ' ' + cy + ')"'
        + ' fill="' + (occ ? on : off) + '"'
        + ' stroke="' + (occ ? so : sof) + '" stroke-width="1.2" rx="1"/>';
    }
    var svg = '<svg width="36" height="28" viewBox="0 0 36 28" style="display:block;">'
      + sq(18,  7, b.second)   // 2nd — top center
      + sq(30, 19, b.first)    // 1st — right
      + sq(6,  19, b.third)    // 3rd — left
      + '</svg>';
    var dots = '<div style="display:flex;gap:3px;justify-content:center;">';
    for (var i = 0; i < 2; i++) {  // only 2 dots — 3 outs ends the inning
      var filled = i < (b.outs || 0);
      dots += '<div style="width:5px;height:5px;border-radius:50%;'
        + 'background:' + (filled ? '#FB4F14' : 'rgba(148,163,184,0.22)') + ';'
        + 'border:1px solid ' + (filled ? '#FB4F14' : 'rgba(148,163,184,0.35)') + ';"></div>';
    }
    dots += '</div>';
    return '<div class="bc-diamond-wrap">' + svg + dots + '</div>';
  }

  function refreshScores() {
    fetch('/api/live-scores')
      .then(function (r) { return r.json(); })
      .then(function (data) {
        Object.keys(data).forEach(function (betId) {
          var info = data[betId];

          var sb = document.querySelector('.bc-scoreboard[data-bet-id="' + betId + '"]');
          if (!sb) return;
          var betSide = sb.getAttribute('data-bet-side') || '';
          var isLive  = info.status === 'Live';
          var isFinal = info.status === 'Final';
          var as = info.away_score, hs = info.home_score;
          // Scores can arrive as strings; compare numerically ("84" > "105" as text).
          var asN = (as !== null && as !== '') ? Number(as) : NaN;
          var hsN = (hs !== null && hs !== '') ? Number(hs) : NaN;
          var awayWin = asN > hsN;
          var homeWin = hsN > asN;

          function team(side, abbr, logo) {
            var img = logo ? '<img class="team-logo" src="' + logo + '" alt="' + abbr + '" loading="lazy" onerror="this.style.visibility=\'hidden\'">' : '';
            var name = '<div class="sb-team-info"><div class="sb-name' + (betSide === side ? ' is-bet' : '') + '">' + abbr + '</div></div>';
            return '<div class="sb-team sb-' + side + '">' + (side === 'away' ? img + name : name + img) + '</div>';
          }
          var center;
          if (isLive || isFinal) {
            center = '<div class="sb-score">'
              + '<span class="sb-score-away' + (awayWin ? ' sb-score-win' : '') + '">' + (as !== null ? as : '–') + '</span>'
              + '<span class="sb-score-sep">–</span>'
              + '<span class="sb-score-home' + (homeWin ? ' sb-score-win' : '') + '">' + (hs !== null ? hs : '–') + '</span></div>'
              + (isLive && info.bases ? renderDiamond(info.bases) : '');
          } else {
            center = '<div class="sb-vs">vs</div>';
          }
          sb.innerHTML = team('away', info.away_abbr, info.away_logo)
            + '<div class="sb-center">' + center + '</div>'
            + team('home', info.home_abbr, info.home_logo);

          // Model-line scale labels + pick abbr
          document.querySelectorAll('.bc-away-abbr[data-bet-id="' + betId + '"]').forEach(function (n) { n.textContent = info.away_abbr; });
          document.querySelectorAll('.bc-home-abbr[data-bet-id="' + betId + '"]').forEach(function (n) { n.textContent = info.home_abbr; });
          document.querySelectorAll('.bc-pick-abbr[data-bet-id="' + betId + '"]').forEach(function (n) {
            if (betSide) n.textContent = betSide === 'home' ? info.home_abbr : info.away_abbr;
          });

          // Header: swap the start time for Live / Final status
          var st = document.querySelector('.bc-status[data-bet-id="' + betId + '"]');
          if (st && (isLive || isFinal)) {
            st.innerHTML = isLive
              ? '<span class="status-live">● ' + (info.period || 'Live') + '</span>'
              : '<span class="status-final">Final</span>';
            var tm = st.parentElement.querySelector('.bc-time');
            if (tm) tm.hidden = true;
          }
          var hdr = document.querySelector('.bc-live-hdr[data-bet-id="' + betId + '"]');
          if (hdr && info.live_implied != null) {
            var imp = info.live_implied;
            var impCls = imp >= 60 ? 'limp-good' : (imp <= 40 ? 'limp-bad' : 'limp-neutral');
            hdr.innerHTML = '<span class="bc-live-implied ' + impCls + '">' + imp.toFixed(1) + '% win</span>';
          }
        });
      })
      .catch(function () {});
  }
  refreshScores();
  setInterval(refreshScores, 120000);
}());
</script>
