{% extends "base.html" %}
{% block title %}Edit Bet — Spooky Sports{% endblock %}

{% block content %}
<div class="card" style="max-width:500px; margin:0 auto;">
    <h2>Edit Bet</h2>
    <form method="post">
        <div class="form-row"><label>Name</label><input name="name" value="{{ b.name }}" required></div>
        <div class="form-row"><label>Sport</label><input name="sport" value="{{ b.sport }}"></div>
        <div class="form-row">
            <label>Type</label>
            <select name="bet_type">
                <option value="Moneyline" {% if b.bet_type == 'Moneyline' %}selected{% endif %}>Moneyline</option>
                <option value="Spread" {% if b.bet_type == 'Spread' %}selected{% endif %}>Spread</option>
                <option value="Over/Under" {% if b.bet_type == 'Over/Under' %}selected{% endif %}>Over/Under</option>
                <option value="Player" {% if b.bet_type == 'Player' %}selected{% endif %}>Player</option>
            </select>
        </div>
        <div class="form-row"><label>Decimal Odds</label><input name="odds" type="number" step="0.01" inputmode="decimal" value="{{ b.odds }}" required></div>
        <div class="form-row"><label>Win Probability (0–1)</label><input name="prob" type="number" step="0.01" inputmode="decimal" value="{{ b.prob }}" required></div>
        <div class="form-row"><label>Stake ($)</label><input name="stake" type="number" step="0.01" inputmode="decimal" value="{{ b.stake }}" required></div>
        <div class="form-row">
            <label>Notes</label>
            <textarea name="notes" rows="2" style="resize:vertical; font-family:inherit; font-size:0.9rem; padding:9px 12px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--bg-input); color:var(--text); width:100%;">{{ b.notes or '' }}</textarea>
        </div>
        <div style="display:flex; gap:8px; margin-top:8px;">
            <button type="submit" style="flex:1;">Save Changes</button>
            <a href="{{ url_for('index') }}" style="flex:1; display:block;">
                <button type="button" class="secondary" style="width:100%;">Cancel</button>
            </a>
        </div>
    </form>
</div>
{% endblock %}
